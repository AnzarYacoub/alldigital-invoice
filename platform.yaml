platform:
    name: SolidInvoice
    version: 3.0.x

    security:
        two_factor:
            enabled: true
            base_template: "@SolidInvoiceCore/Layout/two_factor_security.html.twig"
    models:
        user: SolidInvoice\UserBundle\Entity\User

saas:
    doctrine:
        subscriptions:
            entity: SolidInvoice\CoreBundle\Entity\Company
        trial:
            user_entity: SolidInvoice\UserBundle\Entity\User
    payment:
        return_route: saas_payment_success
    integration:
        lemon_squeezy:
            enabled: true
            api_key: '%env(SOLIDINVOICE_LEMON_SQUEEZY_API_KEY)%'
            webhook_secret: '%env(SOLIDINVOICE_LEMON_SQUEEZY_WEBHOOK_SECRET)%'
            store_id: '%env(SOLIDINVOICE_LEMON_SQUEEZY_STORE_ID)%'
    # Canonical catalogue of every gated feature. Keep the keys here in lock-step
    # with `SolidInvoice\SaasBundle\Feature\Feature` (asserted by FeatureCatalogTest).
    # Defaults are the un-overridden values returned by FeatureGate::resolve()
    # when no plan/subscriber is in context (CLI commands, fixtures, etc.).
    features:
        total_clients:
            type: integer
            default: -1
            description: 'clients'
        invoices_per_month:
            type: integer
            default: -1
            description: 'invoices'
        team_seats:
            type: integer
            default: -1
            description: 'Team members'
        quotes:
            type: boolean
            default: true
            description: 'Create and send professional quotes'
        online_payments:
            type: boolean
            default: true
            description: 'Online payment support'
        recurring_invoices:
            type: boolean
            default: true
            description: 'Recurring invoices, sent automatically'
        automated_reminders:
            type: boolean
            default: true
            description: 'Automatic payment reminders'
        multi_currency:
            type: boolean
            default: true
            description: 'Multi-currency invoicing and payments'
        custom_branding:
            type: boolean
            default: true
            description: 'Custom invoice branding'
        rest_api_access:
            type: boolean
            default: true
            description: 'API access'
        mcp_access:
            type: boolean
            default: true
            description: 'Advanced integrations'
        custom_domain:
            type: boolean
            default: true
            description: 'Custom domain / branded web address'
        custom_fields:
            type: boolean
            default: true
            description: 'Custom fields for clients, invoices and quotes'

ui:
    templates:
        base: '@SolidInvoiceCore/Layout/base.html.twig'
        login: '@SolidInvoiceUser/Security/login.html.twig'
